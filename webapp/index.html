<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFA Technical Object Characteristics Report</title>

    <!--
      UI5 is bootstrapped from the public CDN so the app runs both under the
      local UI5 tooling server and under the BTP approuter without needing a
      separate UI5 resources destination. Use the floating 1.120 LTS line so the
      URL stays resolvable when SAP rotates patch versions off the CDN.
    -->
    <script
      id="sap-ui-bootstrap"
      src="https://ui5.sap.com/1.120/resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-resourceroots='{ "com.cfa.charlist": "./" }'
      data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
      data-sap-ui-compatVersion="edge"
      data-sap-ui-async="true"
      data-sap-ui-frameOptions="trusted"
    ></script>
  </head>
  <body class="sapUiBody">
    <div
      data-sap-ui-component
      data-name="com.cfa.charlist"
      data-id="container"
      data-settings='{ "id": "charlist" }'
      style="height: 100%"
    ></div>
  </body>
</html>
